# Écran éteint : musique, navigation, notifications ; personne ne regarde.

# La moitié de la fréquence maximale suffit à tout ce qui tourne écran éteint.
/sys/devices/system/cpu/cpufreq/policy*/scaling_max_freq = 50% cpuinfo_max_freq

# Pas de coup d'accélérateur quand on touche l'écran : personne ne le touche.
/proc/sys/walt/input_boost/input_boost_ms = 0
/proc/sys/walt/sched_boost = 0

# Le disque est vidé toutes les 30 s au lieu de 5 s : moins de réveils.
/proc/sys/vm/dirty_writeback_centisecs = 3000
