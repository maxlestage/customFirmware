# Économie : écran allumé, la batterie est ménagée sans que le téléphone paraisse lent.

# Chaque ligne : <réglage du noyau> = <valeur>. `*` remplace n'importe quel morceau du nom.
# « 85% cpuinfo_max_freq » : 85 % de la fréquence maximale du groupe de cœurs, arrondie à
# une fréquence qu'il sait faire. Les dernières fréquences sont celles qui coûtent le plus
# d'énergie pour le moins de vitesse en plus.
/sys/devices/system/cpu/cpufreq/policy*/scaling_max_freq = 85% cpuinfo_max_freq

# Pas de « boost » global du planificateur WALT (0 : aucun).
/proc/sys/walt/sched_boost = 0
