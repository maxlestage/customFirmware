# Économie forte : batterie faible, on tient le plus longtemps possible.

# Les cœurs plafonnent aux deux tiers de leur fréquence maximale.
/sys/devices/system/cpu/cpufreq/policy*/scaling_max_freq = 65% cpuinfo_max_freq

# WALT ne saute à sa « fréquence haute » qu'au-delà de 95 % de charge du cœur.
/sys/devices/system/cpu/cpufreq/policy*/walt/hispeed_load = 95

/proc/sys/walt/sched_boost = 0

# Le disque est vidé moins souvent (toutes les 15 s au lieu de 5 s) : moins de réveils.
/proc/sys/vm/dirty_writeback_centisecs = 1500

# Le GPU (Adreno) perd son niveau le plus rapide : 0 est le plus rapide, 1 le suivant.
# À décommenter après avoir vérifié avec `energie lire '/sys/class/kgsl/kgsl-3d0/*pwrlevel*'`.
# /sys/class/kgsl/kgsl-3d0/max_pwrlevel = 1
