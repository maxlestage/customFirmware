# Les règles d'energie : quel profil appliquer, et quand.
# Un profil est un fichier de profils/ (sans le .conf) ; « origine » remet les réglages
# d'origine du noyau ; « aucun » désactive une règle.

[regles]
# Par ordre de priorité : branché, écran éteint, batterie faible, sinon le défaut.
en_charge = origine
ecran_eteint = ecran_eteint
batterie_faible = economie_forte
seuil_batterie_faible = 20
defaut = economie

[demon]
# Toutes les combien de secondes regarder l'écran et la batterie (en veille, rien ne tourne).
intervalle_s = 2
# Toutes les combien de secondes noter la consommation dans journal.csv (0 : jamais).
journal_s = 60

[capteurs]
batterie = /sys/class/power_supply/battery
ecran = /sys/class/backlight/*/brightness
