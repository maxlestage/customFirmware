# Teste chaque push. Quand tout est vert, la branche est fusionnée dans master
# (sauf les branches wip/...), puis le site est publié sur GitHub Pages et Heroku.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # Le service Rust est compilé par AOSP, pas par Cargo : on vérifie au moins sa syntaxe.
      - run: rustfmt --check --edition 2021 services/hello/src/main.rs
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Export statique
        working-directory: site
        run: SITE_BASE=/customFirmware cargo run -- export ../dist

  merge:
    name: Fusion dans master
    needs: test
    if: >-
      github.event_name == 'push' && github.ref_name != 'master' &&
      github.ref_name != 'gh-pages' && !startsWith(github.ref_name, 'wip/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: merge-into-master
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Fusionner ${{ github.ref_name }}
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$SHA"
          if git merge-base --is-ancestor "$SHA" HEAD; then
            echo "$BRANCH est déjà dans master."
            exit 0
          fi
          git merge --no-ff --no-edit "$SHA" -m "Merge branch '$BRANCH' into master (auto-merge)"
          git push origin HEAD:master
      # Un push fait par un workflow ne lance aucun autre workflow : on lance les
      # publications à la main.
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref master --repo "$GITHUB_REPOSITORY"
          gh workflow run heroku.yml --ref master --repo "$GITHUB_REPOSITORY"
